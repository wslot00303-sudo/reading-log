<title>読書ログ Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
async function startBarcodeScan(){
  if(!("BarcodeDetector" in window)) return setMsg("saveMsg","このブラウザはバーコード読取に未対応です。Chrome/Edgeなどで試してください。");
  if(!navigator.mediaDevices?.getUserMedia) return setMsg("saveMsg","カメラを利用するにはHTTPS接続が必要です。");
  let stream=null, overlay=null;
  const cleanup=()=>{try{stream?.getTracks().forEach(t=>t.stop())}catch{} overlay?.remove()};
  try{
    const detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]});
    overlay=document.createElement("div");
    overlay.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.84);display:grid;place-items:center;padding:20px";
    overlay.innerHTML='<div style="width:min(92vw,520px);background:#111;color:#fff;border-radius:20px;padding:14px;text-align:center"><b>本のバーコードを枠内へ</b><video autoplay playsinline muted style="width:100%;margin-top:10px;border-radius:14px"></video><button id="x" style="margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px">終了</button></div>';
    document.body.appendChild(overlay);
    overlay.querySelector("#x").onclick=cleanup;
    const video=overlay.querySelector("video");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject=stream; await video.play();
    const loop=async()=>{
      if(!document.body.contains(overlay)) return;
      try{
        const codes=await detector.detect(video);
        const raw=codes?.[0]?.rawValue?.replace(/[^0-9Xx]/g,"").toUpperCase();
        if(raw && (/^(978|979)\d{10}$/.test(raw) || /^\d{9}[\dX]$/.test(raw))){
          cleanup(); $("isbn").value=raw; await lookup(); return;
        }
      }catch{}
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }catch(e){cleanup();setMsg("saveMsg","カメラを起動できませんでした: "+e.message)}
}

</script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#111827;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:auto;padding:18px 16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted)}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--accent);color:white;font-weight:700}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff;color:var(--danger);border:1px solid #f2c5c0}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel,.book{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:14px}.stat b{font-size:26px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.panel{padding:16px;margin-top:14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:flex;gap:8px;align-items:center}.hidden{display:none!important}.notice{padding:10px 12px;border-radius:10px;background:#f2f4f7;color:#475467;font-size:13px}.ok{color:var(--ok)}.err{color:var(--danger)}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}.books{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.book{overflow:hidden}.cover{height:230px;background:#eef2f6;display:flex;align-items:center;justify-content:center}.cover img{width:100%;height:100%;object-fit:cover}.bookbody{padding:12px}.title{font-weight:800;line-height:1.35}.meta{color:var(--muted);font-size:12px;margin-top:5px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;background:#f2f4f7;padding:4px 7px;border-radius:999px}.empty{padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}
dialog{border:0;border-radius:18px;width:min(700px,calc(100% - 24px));padding:0;box-shadow:0 24px 80px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(0,0,0,.4)}.dlg{padding:18px}.dlg h2{margin:0 0 14px}.close{float:right}
.auth{max-width:460px;margin:70px auto}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.books{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.formgrid,.toolbar,.books{grid-template-columns:1fr}.cover{height:300px}.top{align-items:flex-start}.brand{font-size:18px}}
</style>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#111827"></head>
<body>
<header><div class="wrap top"><div><div class="brand">📚 読書ログ Cloud</div><div class="sub">Supabase同期版</div></div><div class="row"><span id="userLabel" class="sub"></span><button id="settingsBtn" class="secondary hidden">設定</button><button id="logoutBtn" class="secondary hidden">ログアウト</button></div></div></header>

<main>
<section id="authView" class="auth panel">
  <h2>クラウド読書ログ</h2>
  <p class="small">メールアドレスでログインすると、本・写真・感想がクラウドに保存され、スマホとPCで同期できます。</p>
  <div class="formgrid">
    <div class="full"><label>メールアドレス</label><input id="email" type="email" autocomplete="email"></div>
    <div class="full"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div>
  </div>
  <div class="actions"><button id="signIn">ログイン</button><button id="signUp" class="secondary">新規登録</button></div>
  <p id="authMsg" class="small"></p>
  <details style="margin-top:14px"><summary>Supabase接続設定</summary>
    <p class="small">このHTMLを自分のSupabaseプロジェクトで使う場合、下の設定を入力して保存してください。anon keyのみを使い、service_role keyは絶対に入力しないでください。</p>
    <div class="formgrid">
      <div class="full"><label>Project URL</label><input id="projectUrl" placeholder="https://xxxxx.supabase.co"></div>
      <div class="full"><label>Publishable / anon key</label><input id="anonKey" placeholder="ey..."></div>
    </div>
    <div class="actions"><button id="saveConfig">設定を保存</button></div>
  </details>
</section>

<section id="appView" class="hidden">
  <div class="grid">
    <div class="stat"><b id="count">0</b><span>登録冊数</span></div>
    <div class="stat"><b id="rated">0</b><span>評価済み</span></div>
    <div class="stat"><b id="pages">0</b><span>総ページ</span></div>
    <div class="stat"><b id="avg">-</b><span>平均評価</span></div>
  </div>

  <section class="panel">
    <h2>本を登録</h2>
    <div class="formgrid">
      <div><label>ISBN</label><input id="isbn" inputmode="numeric" placeholder="978..."></div>
      <div><label>タイトル</label><input id="title"></div>
      <div><label>著者</label><input id="author"></div>
      <div><label>出版社</label><input id="publisher"></div>
      <div><label>読了日</label><input id="readDate" type="date"></div>
      <div><label>ページ数</label><input id="pagesInput" type="number" min="0"></div>
      <div><label>状態</label><select id="status"><option value="unread">未読</option><option value="reading">読書中</option><option value="read">読了</option></select></div>
      <div><label>評価</label><select id="rating"><option value="">未評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
      <div class="full"><label>タグ</label><input id="tags" placeholder="営業, 小説, 学び"></div>
      <div class="full"><label>感想</label><textarea id="impression"></textarea></div>
      <div class="full"><label>印象に残った一文・メモ</label><textarea id="quote"></textarea></div>
      <div><label>表紙写真</label><input id="photo" type="file" accept="image/*" capture="environment"></div>
      <div><label>お気に入り</label><select id="favorite"><option value="false">いいえ</option><option value="true">はい</option></select></div>
    </div>
    <div class="actions"><button id="scanBarcode" class="secondary">バーコード読取</button><button id="lookup">ISBNから自動取得</button><button id="saveBook">クラウドに保存</button><button id="clearForm" class="secondary">クリア</button></div>
    <p id="saveMsg" class="small"></p>
  </section>

  <section class="panel">
    <div class="toolbar"><input id="search" placeholder="タイトル・著者・出版社・感想を検索"><select id="filter"><option value="">すべて</option><option value="unread">未読</option><option value="reading">読書中</option><option value="read">読了</option><option value="favorite">お気に入り</option></select><select id="sort"><option value="new">新しい順</option><option value="rating">評価順</option><option value="title">タイトル順</option></select></div>
    <div id="books" class="books"></div>
  </section>
</section>
</main>

<dialog id="settingsDialog"><div class="dlg"><button class="secondary close" onclick="settingsDialog.close()">閉じる</button><h2>設定</h2><p class="small">現在の接続先を確認・変更できます。</p><label>Project URL</label><input id="projectUrl2"><label style="margin-top:10px">Publishable / anon key</label><input id="anonKey2"><div class="actions"><button id="saveConfig2">保存して再接続</button></div><p id="settingsMsg" class="small"></p></div></dialog>

<script>
const KEY="reading-log-supabase-config-v2";
const DEFAULT_SUPABASE_URL="https://zrntdqslhkrfpbuvlbnd.supabase.co";
const DEFAULT_PUBLISHABLE_KEY="sb_publishable_xIkXTxAFhrhqDOfLNf6MSQ_LsL45HN7";
const ISBN_FUNCTION_URL="https://zrntdqslhkrfpbuvlbnd.supabase.co/functions/v1/isbn-lookup";
let supabase=null, user=null, books=[], editingId=null, photoBlob=null;
const $=id=>document.getElementById(id);
function connect(){
  const c=cfg();
  if(!c.url||!c.key) return false;
  try{
    if(!window.supabase?.createClient) return false;
    supabase=window.supabase.createClient(c.url,c.key);
    return true;
  }catch(e){
    console.error("Supabase connection error:",e);
    return false;
  }
}
function cfg(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||"{}");
    return {url:saved.url||DEFAULT_SUPABASE_URL,key:saved.key||DEFAULT_PUBLISHABLE_KEY};
  }catch{return {url:DEFAULT_SUPABASE_URL,key:DEFAULT_PUBLISHABLE_KEY}}
}
async function init(){
  if(!connect()){showAuth();return}
  const {data}=await supabase.auth.getSession(); user=data.session?.user||null;
  supabase.auth.onAuthStateChange((_e,s)=>{user=s?.user||null; user?showApp():showAuth()});
  user?showApp():showAuth();
}
function showAuth(){$("authView").classList.remove("hidden");$("appView").classList.add("hidden");$("settingsBtn").classList.add("hidden");$("logoutBtn").classList.add("hidden");}
async function showApp(){$("authView").classList.add("hidden");$("appView").classList.remove("hidden");$("settingsBtn").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");$("userLabel").textContent=user.email||"";await loadBooks()}
async function saveConfig(){
 const url=$("projectUrl").value.trim(),key=$("anonKey").value.trim();
 if(!url||!key)return setMsg("authMsg","Project URLとanon keyを入力してください。");
 localStorage.setItem(KEY,JSON.stringify({url,key})); connect(); setMsg("authMsg","接続設定を保存しました。ログインできます。",true);
}
async function auth(mode){
 if(!connect())return setMsg("authMsg","先にSupabase接続設定を保存してください。");
 const email=$("email").value.trim(),password=$("password").value;
 if(mode==="in"){const r=await supabase.auth.signInWithPassword({email,password}); if(r.error)return setMsg("authMsg",r.error.message); setMsg("authMsg","ログインしました。",true)}
 else {const r=await supabase.auth.signUp({email,password}); if(r.error)return setMsg("authMsg",r.error.message); setMsg("authMsg","登録しました。メール確認が必要な設定の場合は受信メールを確認してください。",true)}
}
async function loadBooks(){
 const r=await supabase.from("books").select("*").order("created_at",{ascending:false});
 if(r.error){setMsg("saveMsg","booksテーブルを確認してください: "+r.error.message);return}
 books=r.data||[];render();
}
function render(){
 const q=$("search").value.toLowerCase(),f=$("filter").value,s=$("sort").value;
 let a=books.filter(b=>{const hay=[b.title,b.author,b.publisher,b.impression,b.quote,b.tags?.join?.(" ")].join(" ").toLowerCase();if(q&&!hay.includes(q))return false;if(f==="favorite"&&!b.favorite)return false;if(f&&f!=="favorite"&&b.status!==f)return false;return true});
 a.sort((x,y)=>s==="title"?(x.title||"").localeCompare(y.title||""):s==="rating"?(y.rating||0)-(x.rating||0):new Date(y.created_at)-new Date(x.created_at));
 $("count").textContent=books.length;$("rated").textContent=books.filter(b=>b.rating).length;$("pages").textContent=books.reduce((n,b)=>n+(b.pages||0),0);const rs=books.filter(b=>b.rating);$("avg").textContent=rs.length?(rs.reduce((n,b)=>n+b.rating,0)/rs.length).toFixed(1):"-";
 $("books").innerHTML=a.length?a.map(card).join(""):'<div class="empty">まだ本がありません。最初の1冊を登録しましょう。</div>';
}
function card(b){
 const cover=b.cover_url?`<img src="${esc(b.cover_url)}" alt="">`:'<span>表紙なし</span>';
 const tags=(b.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("");
 return `<article class="book"><div class="cover">${cover}</div><div class="bookbody"><div class="title">${b.favorite?"★ ":""}${esc(b.title||"無題")}</div><div class="meta">${esc(b.author||"著者不明")} · ${esc(b.publisher||"出版社不明")}</div><div class="meta">${b.status==="read"?"読了":b.status==="reading"?"読書中":"未読"} ${b.rating?" · "+"★".repeat(b.rating):""}</div><div class="chips">${tags}</div><div class="actions"><button onclick="editBook('${b.id}')">編集</button><button class="danger" onclick="deleteBook('${b.id}')">削除</button></div></div></article>`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function lookup(){
 const isbn=$("isbn").value.replace(/[^0-9Xx]/g,"").toUpperCase();
 if(!isbn)return setMsg("saveMsg","ISBNを入力してください。");
 setMsg("saveMsg","ISBNから書籍情報を取得中...",true);
 try{
   if(!connect()) throw Error("Supabase接続設定がありません");
   const {data:{session}}=await supabase.auth.getSession();
   if(!session) throw Error("先にログインしてください");
   const r=await fetch(ISBN_FUNCTION_URL,{
     method:"POST",
     headers:{"Content-Type":"application/json","apikey":cfg().key,"Authorization":"Bearer "+session.access_token},
     body:JSON.stringify({isbn})
   });
   const j=await r.json();
   if(!r.ok) throw Error(j.error||"書籍情報が見つかりませんでした");
   $("isbn").value=j.isbn||isbn;
   $("title").value=j.title||"";
   $("author").value=j.author||"";
   $("publisher").value=j.publisher||"";
   if($("pagesInput")) $("pagesInput").value=j.pages||"";
   window._coverUrl=j.coverUrl||"";
   setMsg("saveMsg","書籍情報を取得しました。",true);
 }catch(e){setMsg("saveMsg","自動取得に失敗しました: "+e.message)}
}
async function saveBook(){
 if(!user)return;
 const title=$("title").value.trim();if(!title)return setMsg("saveMsg","タイトルを入力してください。");
 let cover_url=window._coverUrl||null;
 if(photoBlob){
   const path=`${user.id}/${crypto.randomUUID()}.jpg`;const up=await supabase.storage.from("book-covers").upload(path,photoBlob,{contentType:"image/jpeg",upsert:false});
   if(up.error)return setMsg("saveMsg","写真アップロード失敗: "+up.error.message);
   const pub=supabase.storage.from("book-covers").getPublicUrl(path);cover_url=pub.data.publicUrl;
 }
 const data={user_id:user.id,isbn:$("isbn").value.trim()||null,title,author:$("author").value.trim()||null,publisher:$("publisher").value.trim()||null,read_date:$("readDate").value||null,pages:Number($("pagesInput").value)||null,status:$("status").value,rating:Number($("rating").value)||null,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),impression:$("impression").value.trim()||null,quote:$("quote").value.trim()||null,favorite:$("favorite").value==="true",cover_url};
 const r=editingId?await supabase.from("books").update(data).eq("id",editingId):await supabase.from("books").insert(data);
 if(r.error)return setMsg("saveMsg",r.error.message);
 editingId=null;photoBlob=null;window._coverUrl=null;clearForm();await loadBooks();setMsg("saveMsg","クラウドに保存しました。",true);
}
function clearForm(){["isbn","title","author","publisher","readDate","pagesInput","tags","impression","quote"].forEach(id=>$(id).value="");$("status").value="unread";$("rating").value="";$("favorite").value="false";$("photo").value="";$("saveBook").textContent="クラウドに保存";editingId=null}
function editBook(id){const b=books.find(x=>x.id===id);if(!b)return;editingId=id;for(const [id,v] of Object.entries({isbn:b.isbn,title:b.title,author:b.author,publisher:b.publisher,readDate:b.read_date,pagesInput:b.pages,tags:(b.tags||[]).join(", "),impression:b.impression,quote:b.quote}))$(id).value=v??"";$("status").value=b.status||"unread";$("rating").value=b.rating||"";$("favorite").value=String(!!b.favorite);$("saveBook").textContent="変更をクラウド保存";window.scrollTo({top:0,behavior:"smooth"})}
async function deleteBook(id){if(!confirm("この本を削除しますか？"))return;const r=await supabase.from("books").delete().eq("id",id);if(r.error)return alert(r.error.message);await loadBooks()}
$("saveConfig").onclick=saveConfig;$("signIn").onclick=()=>auth("in");$("signUp").onclick=()=>auth("up");$("lookup").onclick=lookup;$("scanBarcode")?.addEventListener("click",startBarcodeScan);$("saveBook").onclick=saveBook;$("clearForm").onclick=clearForm;$("search").oninput=render;$("filter").onchange=render;$("sort").onchange=render;$("logoutBtn").onclick=()=>supabase.auth.signOut();$("settingsBtn").onclick=()=>{const c=cfg();$("projectUrl2").value=c.url||"";$("anonKey2").value=c.key||"";$("settingsDialog").showModal()};$("saveConfig2").onclick=()=>{localStorage.setItem(KEY,JSON.stringify({url:$("projectUrl2").value.trim(),key:$("anonKey2").value.trim()}));connect();$("settingsMsg").textContent="保存しました。ページを再読み込みしてください。"};
$("photo").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),max=1400,scale=Math.min(1,max/img.width);c.width=img.width*scale;c.height=img.height*scale;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>photoBlob=b,"image/jpeg",.82)};img.src=URL.createObjectURL(f)};
$("projectUrl").value=cfg().url||"";$("anonKey").value=cfg().key||"";init();
</script>
<script>if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
