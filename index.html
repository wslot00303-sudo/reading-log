<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="クラウド同期できる個人読書ログ">
<link rel="manifest" href="./manifest.webmanifest"><title>読書ログ Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#111827;--danger:#b42318;--ok:#067647;--soft:#f2f4f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff;color:var(--danger);border:1px solid #f2c5c0}.wrap,main{max-width:1100px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.sub,.small{font-size:12px;color:var(--muted)}header{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.row,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:16px}.panel{padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px}.stat b{font-size:25px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.ok{color:var(--ok)}.err{color:var(--danger)}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.book{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}.cover{height:260px;background:#eef2f6;display:flex;align-items:center;justify-content:center}.cover img{width:100%;height:100%;object-fit:cover}.bookbody{padding:12px}.title{font-weight:800;line-height:1.35}.meta{color:var(--muted);font-size:12px;margin-top:5px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;background:var(--soft);padding:4px 7px;border-radius:999px}.empty{padding:35px;text-align:center;color:var(--muted);grid-column:1/-1}.auth{max-width:470px;margin:65px auto}.detailCover{width:min(260px,80vw);aspect-ratio:3/4;object-fit:cover;background:#eef2f6;border-radius:12px}.detailGrid{display:grid;grid-template-columns:260px 1fr;gap:20px}.detailText{white-space:pre-wrap;line-height:1.7}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}dialog{border:0;border-radius:18px;width:min(780px,calc(100% - 20px));padding:0;box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.45)}.dlg{padding:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.books{grid-template-columns:repeat(3,1fr)}.detailGrid{grid-template-columns:1fr}.detailCover{margin:auto}}@media(max-width:600px){.formgrid,.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.books{grid-template-columns:repeat(2,1fr)}.cover{height:230px}.brand{font-size:18px}}@media(max-width:400px){.books{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="brand">📚 読書ログ Cloud</div><div class="sub">Supabase同期版</div></div><div class="row"><span id="userLabel" class="sub"></span><button id="settingsBtn" class="secondary hidden" type="button">設定</button><button id="logoutBtn" class="secondary hidden" type="button">ログアウト</button></div></div></header>
<main>
<section id="authView" class="auth panel"><h2>クラウド読書ログ</h2><p class="small">ログインすると本・表紙・感想がクラウド保存され、端末を変えても同期できます。</p><div class="formgrid"><div class="full"><label>メールアドレス</label><input id="email" type="email" autocomplete="email"></div><div class="full"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="actions" style="margin-top:12px"><button id="signIn" type="button">ログイン</button><button id="signUp" class="secondary" type="button">新規登録</button></div><p id="authMsg" class="small"></p><details><summary>Supabase接続設定</summary><p class="small">通常は初期設定済みです。変更する場合のみ使用してください。service_role keyは入力しないでください。</p><div class="formgrid"><div class="full"><label>Project URL</label><input id="projectUrl"></div><div class="full"><label>Publishable / anon key</label><input id="anonKey"></div></div><div class="actions"><button id="saveConfig" type="button">設定を保存</button></div></details></section>
<section id="appView" class="hidden">
<div class="grid"><div class="stat"><b id="count">0</b><span>登録冊数</span></div><div class="stat"><b id="rated">0</b><span>評価済み</span></div><div class="stat"><b id="pages">0</b><span>読了ページ</span></div><div class="stat"><b id="avg">-</b><span>平均評価</span></div><div class="stat"><b id="yearRead">0</b><span>今年の読了</span></div></div>
<section class="panel"><div class="sectionTitle"><h2>本を登録</h2><span id="saveMsg" class="small"></span></div><div class="formgrid">
<div><label>ISBN</label><input id="isbn" inputmode="numeric" placeholder="978..."></div><div><label>タイトル</label><input id="title"></div><div><label>著者</label><input id="author"></div><div><label>出版社</label><input id="publisher"></div><div><label>読了日</label><input id="readDate" type="date"></div><div><label>ページ数</label><input id="pagesInput" type="number" min="0"></div><div><label>読書状況</label><select id="status"><option value="unread">未読</option><option value="reading">読書中</option><option value="read">読了</option></select></div><div><label>評価</label><select id="rating"><option value="">未評価</option><option value="1">★1</option><option value="2">★2</option><option value="3">★3</option><option value="4">★4</option><option value="5">★5</option></select></div><div class="full"><label>タグ</label><input id="tags" placeholder="営業, 小説, 学び"></div><div class="full"><label>感想</label><textarea id="impression"></textarea></div><div class="full"><label>印象に残った一文・メモ</label><textarea id="quote"></textarea></div><div><label>表紙写真</label><input id="photo" type="file" accept="image/*" capture="environment"></div><div><label>お気に入り</label><select id="favorite"><option value="false">いいえ</option><option value="true">はい</option></select></div></div><div class="actions" style="margin-top:12px"><button id="scanBarcode" class="secondary" type="button">バーコード読取</button><button id="lookup" type="button">ISBNから自動取得</button><button id="saveBook" type="button">クラウドに保存</button><button id="clearForm" class="secondary" type="button">クリア</button></div></section>
<section class="panel"><div class="sectionTitle"><h2>本棚</h2><span class="small">本をタップすると詳細</span></div><div class="toolbar"><input id="search" placeholder="タイトル・著者・タグ・ISBN・感想・メモを検索"><select id="filter"><option value="all">すべて</option><option value="favorite">お気に入り</option><option value="rating5">★5</option><option value="rating4">★4以上</option><option value="rating3">★3以上</option><option value="unread">未読</option><option value="reading">読書中</option><option value="read">読了</option></select><select id="sort"><option value="new">新しく登録</option><option value="readDate">読了日</option><option value="rating">評価</option><option value="title">タイトル</option><option value="author">著者</option></select></div><div id="books" class="books"></div></section>
</section></main>
<dialog id="detailDialog"><div class="dlg"><div class="sectionTitle"><h2 id="detailTitle">詳細</h2><button id="detailClose" class="secondary" type="button">閉じる</button></div><div id="detailBody"></div></div></dialog>
<dialog id="settingsDialog"><div class="dlg"><div class="sectionTitle"><h2>設定</h2><button id="settingsClose" class="secondary" type="button">閉じる</button></div><label>Project URL</label><input id="projectUrl2"><label style="margin-top:10px">Publishable / anon key</label><input id="anonKey2"><div class="actions" style="margin-top:12px"><button id="saveConfig2" type="button">保存して再接続</button></div><p id="settingsMsg" class="small"></p></div></dialog>
<script>
"use strict";
const CONFIG_KEY="reading-log-supabase-config-v3",DEFAULT_URL="https://zrntdqslhkrfpbuvlbnd.supabase.co",DEFAULT_KEY="sb_publishable_xIkXTxAFhrhqDOfLNf6MSQ_LsL45HN7",ISBN_FUNCTION_URL="https://zrntdqslhkrfpbuvlbnd.supabase.co/functions/v1/isbn-lookup";
let supabaseClient=null,currentUser=null,books=[],editingId=null,photoBlob=null;const $=id=>document.getElementById(id);
function setMsg(id,msg,ok=false){const e=$(id);if(!e)return;e.textContent=msg;e.className="small "+(ok?"ok":"err")}
function cfg(){try{const x=JSON.parse(localStorage.getItem(CONFIG_KEY)||"{}");return{url:x.url||DEFAULT_URL,key:x.key||DEFAULT_KEY}}catch{return{url:DEFAULT_URL,key:DEFAULT_KEY}}}
function connect(){try{const c=cfg();if(!window.supabase?.createClient||!c.url||!c.key)return false;supabaseClient=window.supabase.createClient(c.url,c.key);return true}catch(e){console.error(e);supabaseClient=null;return false}}
function showAuth(){$("authView").classList.remove("hidden");$("appView").classList.add("hidden");$("settingsBtn").classList.add("hidden");$("logoutBtn").classList.add("hidden");$("userLabel").textContent=""}
async function showApp(){$("authView").classList.add("hidden");$("appView").classList.remove("hidden");$("settingsBtn").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");$("userLabel").textContent=currentUser?.email||"";await loadBooks()}
async function auth(mode){try{if(!connect())return setMsg("authMsg","Supabaseに接続できません。ページを再読み込みしてください。");const email=$("email").value.trim(),password=$("password").value;if(!email)return setMsg("authMsg","メールアドレスを入力してください。");if(password.length<6)return setMsg("authMsg","パスワードは6文字以上にしてください。");setMsg("authMsg",mode==="up"?"登録処理中...":"ログイン処理中...",true);const r=mode==="up"?await supabaseClient.auth.signUp({email,password}):await supabaseClient.auth.signInWithPassword({email,password});if(r.error)return setMsg("authMsg",r.error.message);if(mode==="up")return setMsg("authMsg",r.data.session?"登録しました。ログイン状態です。":"登録しました。確認メールが届く設定なら、メール内の確認リンクを開いてください。",true);setMsg("authMsg","ログインしました。",true)}catch(e){console.error(e);setMsg("authMsg","エラー: "+(e?.message||String(e)))}}
function saveConfig(){const url=$("projectUrl").value.trim(),key=$("anonKey").value.trim();if(!url||!key)return setMsg("authMsg","Project URLとPublishable / anon keyを入力してください。");localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));setMsg("authMsg",connect()?"接続設定を保存しました。":"接続設定を確認してください。",!!supabaseClient)}
async function loadBooks(){if(!supabaseClient||!currentUser)return;const r=await supabaseClient.from("books").select("*").order("created_at",{ascending:false});if(r.error)return setMsg("saveMsg","本棚の取得に失敗: "+r.error.message);books=r.data||[];render()}
function norm(v){return String(v??"").toLocaleLowerCase("ja-JP")}
function render(){const q=norm($("search").value.trim()),f=$("filter").value,s=$("sort").value;let a=books.filter(b=>{const hay=norm([b.title,b.author,b.publisher,b.isbn,b.impression,b.quote,...(b.tags||[])].join(" "));if(q&&!hay.includes(q))return false;if(f==="favorite"&&!b.favorite)return false;if(f==="rating5"&&(b.rating||0)<5)return false;if(f==="rating4"&&(b.rating||0)<4)return false;if(f==="rating3"&&(b.rating||0)<3)return false;if(["unread","reading","read"].includes(f)&&b.status!==f)return false;return true});a.sort((x,y)=>s==="rating"?(y.rating||0)-(x.rating||0):s==="title"?norm(x.title).localeCompare(norm(y.title)):s==="author"?norm(x.author).localeCompare(norm(y.author)):s==="readDate"?String(y.read_date||"").localeCompare(String(x.read_date||"")):new Date(y.created_at||0)-new Date(x.created_at||0));$("count").textContent=books.length;$("rated").textContent=books.filter(b=>b.rating).length;$("pages").textContent=books.filter(b=>b.status==="read").reduce((n,b)=>n+(Number(b.pages)||0),0);const rs=books.filter(b=>b.rating);$("avg").textContent=rs.length?(rs.reduce((n,b)=>n+Number(b.rating),0)/rs.length).toFixed(1):"-";const year=new Date().getFullYear();$("yearRead").textContent=books.filter(b=>b.status==="read"&&String(b.read_date||"").startsWith(String(year))).length;$("books").innerHTML=a.length?a.map(card).join(""):"<div class='empty'>まだ本がありません。最初の1冊を登録しましょう。</div>"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(b){const cover=b.cover_url?"<img src='"+esc(b.cover_url)+"' alt=''>":"<span>表紙なし</span>",tags=(b.tags||[]).map(t=>"<span class='chip'>"+esc(t)+"</span>").join(""),stars=b.rating?"★".repeat(Number(b.rating)):"未評価";return"<article class='book' data-id='"+esc(b.id)+"'><div class='cover'>"+cover+"</div><div class='bookbody'><div class='title'>"+(b.favorite?"★ ":"")+esc(b.title||"無題")+"</div><div class='meta'>"+esc(b.author||"著者不明")+"</div><div class='meta'>"+(b.status==="read"?"読了":b.status==="reading"?"読書中":"未読")+" · "+stars+"</div><div class='chips'>"+tags+"</div></div></article>"}
function openDetail(id){const b=books.find(x=>x.id===id);if(!b)return;const cover=b.cover_url?"<img class='detailCover' src='"+esc(b.cover_url)+"' alt=''>":"<div class='detailCover'></div>",stars=b.rating?"★".repeat(Number(b.rating)):"未評価";$("detailTitle").textContent=b.title||"無題";$("detailBody").innerHTML="<div class='detailGrid'><div>"+cover+"</div><div><p><b>著者</b><br>"+esc(b.author||"-")+"</p><p><b>出版社</b><br>"+esc(b.publisher||"-")+"</p><p><b>ISBN</b><br>"+esc(b.isbn||"-")+"</p><p><b>読了日</b><br>"+esc(b.read_date||"-")+"</p><p><b>ページ数</b><br>"+esc(b.pages??"-")+"</p><p><b>状態</b><br>"+({read:"読了",reading:"読書中",unread:"未読"}[b.status]||"-")+"</p><p><b>評価</b><br>"+stars+"</p><p><b>お気に入り</b><br>"+(b.favorite?"★":"-")+"</p><p><b>タグ</b><br>"+esc((b.tags||[]).join(" / ")||"-")+"</p><p><b>感想</b></p><div class='detailText'>"+esc(b.impression||"-")+"</div><p><b>印象に残った一文・メモ</b></p><div class='detailText'>"+esc(b.quote||"-")+"</div></div></div><div class='modalActions'><button class='secondary' type='button' onclick="editBook('"+esc(b.id)+"')">編集</button><button class='danger' type='button' onclick="deleteBook('"+esc(b.id)+"')">削除</button></div>";$("detailDialog").showModal()}
function editBook(id){const b=books.find(x=>x.id===id);if(!b)return;editingId=id;["isbn","title","author","publisher","readDate","pagesInput","impression","quote"].forEach((id)=>$(id).value="");$("isbn").value=b.isbn||"";$("title").value=b.title||"";$("author").value=b.author||"";$("publisher").value=b.publisher||"";$("readDate").value=b.read_date||"";$("pagesInput").value=b.pages??"";$("status").value=b.status||"unread";$("rating").value=b.rating??"";$("tags").value=(b.tags||[]).join(", ");$("impression").value=b.impression||"";$("quote").value=b.quote||"";$("favorite").value=String(!!b.favorite);$("photo").value="";$("saveBook").textContent="変更を保存";$("detailDialog").close();window.scrollTo({top:0,behavior:"smooth"})}
async function deleteBook(id){if(!confirm("この本を削除しますか？"))return;const r=await supabaseClient.from("books").delete().eq("id",id).eq("user_id",currentUser.id);if(r.error)return alert(r.error.message);await loadBooks();$("detailDialog").close()}
function clearForm(){["isbn","title","author","publisher","readDate","pagesInput","tags","impression","quote"].forEach(id=>$(id).value="");$("status").value="unread";$("rating").value="";$("favorite").value="false";$("photo").value="";editingId=null;photoBlob=null;window._coverUrl=null;$("saveBook").textContent="クラウドに保存"}
async function lookup(){try{const isbn=$("isbn").value.replace(/[^0-9Xx]/g,"").toUpperCase();if(!isbn)return setMsg("saveMsg","ISBNを入力してください。");if(!connect())return setMsg("saveMsg","Supabase接続に失敗しました。");const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return setMsg("saveMsg","先にログインしてください。");setMsg("saveMsg","ISBNから書籍情報を取得中...",true);const r=await fetch(ISBN_FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg().key,"Authorization":"Bearer "+session.access_token},body:JSON.stringify({isbn})});const j=await r.json();if(!r.ok)throw Error(j.error||"書籍情報が見つかりませんでした");$("isbn").value=j.isbn||isbn;$("title").value=j.title||"";$("author").value=j.author||"";$("publisher").value=j.publisher||"";$("pagesInput").value=j.pages||"";window._coverUrl=j.coverUrl||"";setMsg("saveMsg","書籍情報を取得しました。",true)}catch(e){setMsg("saveMsg","自動取得に失敗: "+(e?.message||String(e)))} }
async function saveBook(){try{if(!currentUser)return setMsg("saveMsg","先にログインしてください。");const title=$("title").value.trim();if(!title)return setMsg("saveMsg","タイトルを入力してください。");let cover_url=window._coverUrl||null;if(photoBlob){const path=currentUser.id+"/"+crypto.randomUUID()+".jpg",up=await supabaseClient.storage.from("book-covers").upload(path,photoBlob,{contentType:"image/jpeg",upsert:false});if(up.error)throw Error("表紙アップロード失敗: "+up.error.message);cover_url=supabaseClient.storage.from("book-covers").getPublicUrl(path).data.publicUrl}const data={user_id:currentUser.id,isbn:$("isbn").value.trim()||null,title,author:$("author").value.trim()||null,publisher:$("publisher").value.trim()||null,read_date:$("readDate").value||null,pages:Number($("pagesInput").value)||null,status:$("status").value,rating:Number($("rating").value)||null,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),impression:$("impression").value.trim()||null,quote:$("quote").value.trim()||null,favorite:$("favorite").value==="true",cover_url};const r=editingId?await supabaseClient.from("books").update(data).eq("id",editingId).eq("user_id",currentUser.id):await supabaseClient.from("books").insert(data);if(r.error)throw Error(r.error.message);clearForm();await loadBooks();setMsg("saveMsg","クラウドに保存しました。",true)}catch(e){setMsg("saveMsg","保存に失敗: "+(e?.message||String(e)))} }
async function startBarcodeScan(){if(!("BarcodeDetector"in window))return setMsg("saveMsg","このブラウザはバーコード読取に未対応です。ISBNを直接入力してください。");if(!navigator.mediaDevices?.getUserMedia)return setMsg("saveMsg","カメラにはHTTPS接続が必要です。");let stream=null;const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:999;background:#111e;color:#fff;display:grid;place-items:center;padding:20px";o.innerHTML='<div style="width:min(92vw,520px);background:#111;padding:16px;border-radius:16px;text-align:center"><b>バーコードを枠内へ</b><video autoplay playsinline muted style="width:100%;margin-top:10px;border-radius:12px"></video><button id="stopScan" type="button" style="margin-top:10px;width:100%">終了</button></div>';document.body.appendChild(o);const v=o.querySelector("video"),cleanup=()=>{try{stream?.getTracks().forEach(t=>t.stop())}catch{}o.remove()};o.querySelector("#stopScan").onclick=cleanup;try{const d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});v.srcObject=stream;await v.play();const loop=async()=>{if(!document.body.contains(o))return;try{const c=(await d.detect(v))?.[0]?.rawValue?.replace(/[^0-9Xx]/g,"").toUpperCase();if(c&&(/^(978|979)\d{10}$/.test(c)||/^\d{9}[\dX]$/.test(c))){cleanup();$("isbn").value=c;await lookup();return}}catch{}requestAnimationFrame(loop)};requestAnimationFrame(loop)}catch(e){cleanup();setMsg("saveMsg","カメラを起動できませんでした: "+e.message)}}
function wire(){$("signIn").onclick=()=>auth("in");$("signUp").onclick=()=>auth("up");$("saveConfig").onclick=saveConfig;$("lookup").onclick=lookup;$("scanBarcode").onclick=startBarcodeScan;$("saveBook").onclick=saveBook;$("clearForm").onclick=clearForm;$("search").oninput=render;$("filter").onchange=render;$("sort").onchange=render;$("logoutBtn").onclick=async()=>{await supabaseClient?.auth.signOut()};$("settingsBtn").onclick=()=>{$("projectUrl2").value=cfg().url;$("anonKey2").value=cfg().key;$("settingsMsg").textContent="";$("settingsDialog").showModal()};$("settingsClose").onclick=()=>$("settingsDialog").close();$("detailClose").onclick=()=>$("detailDialog").close();$("saveConfig2").onclick=()=>{const url=$("projectUrl2").value.trim(),key=$("anonKey2").value.trim();if(!url||!key)return $("settingsMsg").textContent="両方入力してください。";localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));$("settingsMsg").textContent=connect()?"接続設定を更新しました。":"接続に失敗しました。"};$("books").onclick=e=>{const c=e.target.closest(".book");if(c)openDetail(c.dataset.id)};$("photo").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),max=1400,scale=Math.min(1,max/img.width);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>photoBlob=b,"image/jpeg",.82)};img.src=URL.createObjectURL(f)};$("projectUrl").value=cfg().url;$("anonKey").value=cfg().key}
async function init(){wire();if(!connect()){showAuth();setMsg("authMsg","Supabase接続を初期化できませんでした。");return}const {data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;if(currentUser)await showApp();else showAuth();supabaseClient.auth.onAuthStateChange((event,session)=>{currentUser=session?.user||null;if(currentUser)showApp();else showAuth()})}
init();
</script>
